<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin | Zenzo</title>
    <link rel="stylesheet" href="styles.css?v=zenzo-race-theme-44">
  </head>
  <body class="checkout-page">
    <main class="checkout-shell">
      <nav class="checkout-nav" aria-label="Admin navigation">
        <a class="brand" href="index.html" aria-label="Zenzo home">
          <span class="brand__logo-frame"><img src="assets/zenzo-logo-mark.png" alt="Zenzo" class="brand__logo" width="520" height="138"></span>
        </a>
        <a class="primary-link" href="index.html#catalog">Back to shop</a>
      </nav>

      <section class="checkout-panel admin-login" id="loginPanel" aria-labelledby="loginTitle">
        <div class="checkout-panel__body">
          <p class="eyebrow">Admin</p>
          <h1 id="loginTitle">Zenzo product login</h1>
          <form class="form-grid" id="loginForm">
            <label class="field field--full">
              Email address
              <input type="email" name="email" autocomplete="username" required>
            </label>
            <label class="field field--full">
              Password
              <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button class="place-order field--full" type="submit">Log in</button>
            <p class="checkout-note field--full" id="loginMessage" role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>

      <div class="admin-app" id="adminDashboard" hidden>
        <div class="admin-tabs" role="tablist" aria-label="Admin sections">
          <button class="admin-tab" type="button" role="tab" id="tab-dashboard" data-tab="dashboard" aria-controls="panel-dashboard">Dashboard</button>
          <button class="admin-tab" type="button" role="tab" id="tab-orders" data-tab="orders" aria-controls="panel-orders">Orders <span class="admin-tab__count" id="ordersTabCount" hidden></span></button>
          <button class="admin-tab" type="button" role="tab" id="tab-products" data-tab="products" aria-controls="panel-products">Products</button>
          <button class="admin-tab" type="button" role="tab" id="tab-add" data-tab="add" aria-controls="panel-add">Add product</button>
          <button class="remove-button admin-logout" id="logoutButton" type="button">Log out</button>
        </div>

        <section class="admin-panel" id="panel-dashboard" role="tabpanel" aria-labelledby="tab-dashboard" data-panel="dashboard" hidden>
          <div class="admin-hero checkout-panel">
            <div class="checkout-panel__body">
              <p class="admin-stat__label">Revenue from paid orders</p>
              <p class="admin-hero__value" id="statRevenue">₹0</p>
              <p class="checkout-note" id="statRevenueNote"></p>
            </div>
          </div>
          <div class="admin-stats" id="adminStats"></div>
          <div class="admin-dashboard-lists">
            <section class="checkout-panel" aria-labelledby="attentionTitle">
              <div class="checkout-panel__body">
                <div class="admin-orders-head">
                  <h2 id="attentionTitle">Needs dispatching</h2>
                  <button class="remove-button account-link" type="button" data-go="orders" data-filter="paid">View all</button>
                </div>
                <div class="admin-orders" id="attentionOrders"></div>
              </div>
            </section>
            <section class="checkout-panel" aria-labelledby="stockTitle">
              <div class="checkout-panel__body">
                <div class="admin-orders-head">
                  <h2 id="stockTitle">Out of stock</h2>
                  <button class="remove-button account-link" type="button" data-go="products">Manage products</button>
                </div>
                <div class="admin-stock-list" id="stockList"></div>
              </div>
            </section>
          </div>
        </section>

        <section class="admin-panel checkout-panel" id="panel-orders" role="tabpanel" aria-labelledby="tab-orders" data-panel="orders" hidden>
          <div class="checkout-panel__body">
            <div class="admin-orders-head">
              <div>
                <p class="eyebrow">Orders</p>
                <h1>Customer orders</h1>
              </div>
            </div>
            <div class="admin-filters" id="orderFilters" role="group" aria-label="Filter orders by status"></div>
            <div class="admin-orders" id="adminOrders"></div>
          </div>
        </section>

        <section class="admin-panel checkout-panel" id="panel-products" role="tabpanel" aria-labelledby="tab-products" data-panel="products" hidden>
          <div class="checkout-panel__body">
            <div class="admin-orders-head">
              <div>
                <p class="eyebrow">Products</p>
                <h1>Your products</h1>
              </div>
              <button class="admin-order__action" type="button" data-go="add">Add product</button>
            </div>
            <p class="checkout-note" id="productsMessage" role="status" aria-live="polite"></p>
            <div class="admin-products" id="adminProducts"></div>
          </div>
        </section>

        <section class="admin-panel checkout-panel admin-add-panel" id="panel-add" role="tabpanel" aria-labelledby="tab-add" data-panel="add" hidden>
          <div class="checkout-panel__body">
            <p class="eyebrow">Products</p>
            <h1 id="productFormTitle">Add new product</h1>
            <form class="form-grid" id="productForm">
              <label class="field field--full">
                Product name
                <input name="name" required>
              </label>
              <label class="field">
                Collection
                <select name="collection" required>
                  <option>Hot Wheels</option>
                  <option>Figurines</option>
                  <option>3D collectibles</option>
                  <option>Accessories</option>
                </select>
              </label>
              <label class="field">
                Series
                <input name="series" value="Assorted Hot Wheels" required>
              </label>
              <label class="field">
                Year
                <input name="year" inputmode="numeric" value="2025" required>
              </label>
              <label class="field">
                Condition
                <select name="condition" required>
                  <option>Sealed Pack</option>
                  <option>Sealed</option>
                  <option>Loose</option>
                  <option>Premium</option>
                </select>
              </label>
              <label class="field">
                Price in INR
                <input name="price" inputmode="numeric" required>
              </label>
              <label class="field">
                Stock
                <input name="stock" inputmode="numeric" value="1" required>
              </label>
              <label class="field field--full">
                Product photo
                <input name="image" type="file" accept="image/*">
              </label>
              <label class="studio-toggle field--full">
                <input name="studio" type="checkbox" checked>
                Studio look: dark stage with red and blue lighting, like the other product photos
              </label>
              <div class="studio-preview field--full" hidden>
                <img alt="Preview of the product photo">
                <p class="checkout-note"></p>
              </div>
              <label class="field field--full">
                Notes
                <textarea name="notes" required>Sealed Hot Wheels pack photographed from available stock.</textarea>
              </label>
              <button class="place-order field--full" type="submit">Add product</button>
              <p class="checkout-note field--full">Products added here appear in the selected collection after saving.</p>
            </form>
          </div>
        </section>
      </div>
    </main>

    <script src="admin-studio.js?v=zenzo-race-theme-36"></script>
    <script src="admin.js?v=zenzo-race-theme-37"></script>
  </body>
</html>
