<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zenzo</title>
    <meta name="description" content="Collector storefront for selling Hot Wheels and 1:64 die-cast cars.">
    <link rel="preload" as="image" href="assets/zenzo-logo-mark.png">
    <link rel="stylesheet" href="styles.css?v=zenzo-race-theme-20">
  </head>
  <body>
    <header class="site-header">
      <nav class="topbar" aria-label="Primary navigation">
        <a class="brand" href="#catalog" aria-label="Zenzo home">
          <span class="brand__logo-frame"><img src="assets/zenzo-logo-mark.png" alt="Zenzo" class="brand__logo" width="520" height="138" fetchpriority="high"></span>
        </a>
        <div class="collection-list topbar__collections" aria-label="Collection filter">
          <button class="collection-card collection-card--all is-active" type="button" data-collection="all">
            <strong>All</strong>
          </button>
          <button class="collection-card collection-card--hotwheels" type="button" data-collection="Hot Wheels">
            <strong>Hot Wheels</strong>
          </button>
          <button class="collection-card collection-card--figurines" type="button" data-collection="Figurines">
            <strong>Figurines</strong>
          </button>
          <button class="collection-card collection-card--printed" type="button" data-collection="3D collectibles">
            <strong>3D</strong>
          </button>
        </div>
        <button class="cart-button" id="cartButton" type="button" aria-controls="cartPanel" aria-expanded="false">
          <span aria-hidden="true">Cart</span>
          <span class="cart-button__count" id="cartCount">0</span>
        </button>
      </nav>
    </header>

    <main>
      <section class="toolbar" aria-label="Catalog controls">
        <label class="search">
          <span class="sr-only">Search cars</span>
          <input id="searchInput" type="search" placeholder="Search name, collection, series">
        </label>
        <label class="select-label">
          <span class="sr-only">Sort products</span>
          <select id="sortSelect">
            <option value="featured">Featured</option>
            <option value="priceAsc">Price low to high</option>
            <option value="priceDesc">Price high to low</option>
            <option value="yearDesc">Newest year</option>
          </select>
        </label>
      </section>

      <section class="catalog" id="catalog" aria-labelledby="catalogTitle">
        <div class="section-heading">
          <p class="eyebrow">Available now</p>
          <h2 id="catalogTitle">Current listings</h2>
        </div>
        <div class="product-grid" id="productGrid"></div>
        <p class="empty-state" id="emptyState" hidden>No matching cars found.</p>
      </section>
    </main>

    <aside class="cart-panel" id="cartPanel" aria-label="Shopping cart" aria-hidden="true">
      <div class="cart-panel__header">
        <h2>Your cart</h2>
        <button class="icon-button" id="closeCart" type="button" aria-label="Close cart">x</button>
      </div>
      <div class="cart-items" id="cartItems"></div>
      <div class="cart-summary">
        <div class="cart-summary__row">
          <span>Subtotal</span>
          <strong id="cartSubtotal">$0.00</strong>
        </div>
        <p>UPI payments are handled through secure checkout before dispatch.</p>
        <a class="checkout-link" id="checkoutLink" href="checkout.html">Checkout</a>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <footer>
      <p>Zenzo collector resale shop. Not affiliated with Mattel or Hot Wheels.</p>
      <a class="footer-admin-link" href="admin.html">Admin</a>
    </footer>

    <script src="app.js?v=zenzo-race-theme-20"></script>
  </body>
</html>
